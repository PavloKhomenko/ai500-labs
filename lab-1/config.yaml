seed: 42
output_dir: /kaggle/working/outputs

data:
  corpus: Goader/kobza
  val_frac: 0.01
  test_frac: 0.01

part1:
  model: utter-project/EuroMoE-2.6B-A0.6B-2512
  l_train: 4096
  scale: 4
  methods: [none, linear, ntk, dynamic_ntk, yarn]
  n_eval_docs: 100
  bin_size: 1024
  passkey_depths: [0.1, 0.5, 0.9]
  passkey_lengths: [4096, 8192, 16384]
  passkey_keys: 20
  passkey_new_tokens: 8
  lm_head_chunk: 1024
  eval_shard: 001_ukr_corpus_00000.parquet   # Part 2 trains on shard 000
  pg19: emozilla/pg19-test

  finetune:
    method: yarn
    seq_len: 8192
    grad_accum: 4
    steps: 200
    lr: 2.0e-4            # LoRA
    lr_emb_norm: 2.0e-5   # embeddings + norms (LongLoRA)
    min_lr_ratio: 0.1
    warmup_steps: 20
    weight_decay: 0.0
    grad_clip: 1.0
    lora_rank: 8
    lora_alpha: 16
    lora_targets: [q_proj, k_proj, v_proj, o_proj]

part2:
  model: utter-project/EuroMoE-2.6B-A0.6B-2512
  seeds: [42, 43]

  data:
    shard: 000_ukr_corpus_00000.parquet
    min_doc_chars: 200
    max_doc_tokens: 2048
    train_pool_tokens: 10000000
    test_buckets: 30
    val_buckets: 10
    seq_len: 1024
    flores: openlanguagedata/flores_plus

  train:
    token_budget: 5000000
    micro_batch: 2
    grad_accum: 4
    lr: 3.0e-5
    min_lr_ratio: 0.1
    warmup_steps: 30
    weight_decay: 0.0
    betas: [0.9, 0.95]
    grad_clip: 1.0
    val_every: 100
    ckpt_every: 200
    bias_update_rate: 1.0e-3

  strategies:
    none:          {aux: 0.0,    z: 0.0,    bias: false, train_router: true}
    aux_1e-3:      {aux: 1.0e-3, z: 0.0,    bias: false, train_router: true}
    aux_1e-2:      {aux: 1.0e-2, z: 0.0,    bias: false, train_router: true}
    bias:          {aux: 0.0,    z: 0.0,    bias: true,  train_router: true}
    frozen_router: {aux: 0.0,    z: 0.0,    bias: false, train_router: false}
    aux_z:         {aux: 1.0e-3, z: 1.0e-3, bias: false, train_router: true}

  eval:
    block_batch: 4
    sentence_batch: 32
    noise_floor_repeats: 1000

wandb:
  project: ai500-lab1-part2
  part1_project: ai500-lab1-part1
  entity: null
  log_checkpoints: true
  part3_project: ai500-lab1-part3

part3:
  model: Qwen/Qwen2.5-1.5B-Instruct
  task: grammarly/spivavtor
  task_filter: gec        # values in the task column: gec, paraphrase, simplification, coherence
  n_experts: 8
  top_k: 2
  lora_rank: 16
  lora_alpha: 32          # alpha = 2r for every adapter
  aux_coef: 1.0e-2        # the strongest aux variant from Part 2
  bias_update_rate: 1.0e-3

  data:                   # train/val from the train split, test from the validation split
    n_train: 4000
    n_val: 300
    n_test: 300
    max_len: 256          # longer examples are dropped, not truncated

  train:
    steps: 250            # 250 x 16 = 1 epoch of n_train; re-check after timing
    micro_batch: 8
    grad_accum: 2
    lr: 2.0e-4
    min_lr_ratio: 0.1
    warmup_steps: 20
    weight_decay: 0.0
    grad_clip: 1.0

  eval:
    batch: 16
    max_new_tokens_ratio: 1.5   # x source length in tokens
