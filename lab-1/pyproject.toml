[project]
name = "lab1"
version = "0.1.0"
description = "AI500 Lab 1: long context and mixture of experts"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "sacrebleu",
    "pyyaml",
    "matplotlib",
    "pandas",
    "wandb>=0.30.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
